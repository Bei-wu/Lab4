
<!DOCTYPE html>
<html>
<head>
    <title>Escape Room</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightgray;
            padding: 40px;
        }

        button {
            padding: 10px;
            margin: 10px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Escape Room</h1>

    <p>You are locked in a room. Find a way to escape!</p>

    <button onclick="findKey()">Find Key</button>
    <button onclick="checkBox()">Check Box</button>
    <button onclick="openDoor()">Open Door</button>
    <button onclick="restart()">Restart</button>

    <p id="message">What will you do first?</p>

    <script>
        let hasKey = false;
        let knowsCode = false;
        let escaped = false;

        function findKey() {
            if (escaped == false) {
                hasKey = true;
                document.getElementById("message").innerHTML =
                    "You found a key!";
            }
        }

        function checkBox() {
            if (escaped == false) {
                knowsCode = true;
                document.getElementById("message").innerHTML =
                    "You found the door code: 1234!";
            }
        }

        function openDoor() {
            if (escaped == true) {
                document.getElementById("message").innerHTML =
                    "You already escaped!";
            } else if (hasKey == false) {
                document.getElementById("message").innerHTML =
                    "The door is locked. Find the key!";
            } else if (knowsCode == false) {
                document.getElementById("message").innerHTML =
                    "You need the door code!";
            } else {
                escaped = true;
                document.getElementById("message").innerHTML =
                    "You opened the door! You escaped!";
            }
        }

        function restart() {
            hasKey = false;
            knowsCode = false;
            escaped = false;
            document.getElementById("message").innerHTML =
                "What will you do first?";
        }
    </script>

</body>
</html>
